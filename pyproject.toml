[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puntboom"
version = "0.1.0"
description = "Sports betting prediction platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "apscheduler>=3.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
puntboom = "puntboom.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/puntboom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
